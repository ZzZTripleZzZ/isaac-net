[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "isaaclab-net"
version = "0.1.0"
description = "GPU-batched 5G network module for massively parallel robot RL in Isaac Lab (prototype)"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.10"
# Install torch first to pick the build (CUDA, or CPU-only via --index-url https://download.pytorch.org/whl/cpu).
# Triton ships with the CUDA build of torch on Linux; it is imported lazily, only by the `triton` backend.
dependencies = ["torch>=2.4", "numpy>=1.23"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5"]
# The docs site (mkdocs.yml): `mkdocs build --strict`. Reads the sources statically; torch is not needed.
# MuJoCo Playground / MJX backend (isaaclab_net.mjx, docs/backends-mjx.md). JAX is pinned: Brax 0.14.2 PPO fails on
# JAX 0.10. Install torch (CUDA build) first, then `pip install -e ".[mjx]"`.
mjx = ["jax[cuda12]==0.9.2", "playground==0.2.0", "brax==0.14.2"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26", "mkdocs-jupyter>=0.25"]

[tool.setuptools.packages.find]
include = ["isaaclab_net*"]

[tool.setuptools.package-data]
# Sionna-derived BLER tables (Apache-2.0) and their license. The 5G-LENA tables (GPL-derived) are never
# shipped: they are generated locally by `python -m isaaclab_net.tools.extract_lena_tables` (see README).
"isaaclab_net.core" = ["data/*.npz", "data/LICENSE-*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "." keeps a plain checkout working without `pip install -e .`; "tests" makes engine_api importable.
pythonpath = [".", "tests"]
markers = [
    "gpu: needs a CUDA GPU (skipped automatically without one)",
    "slow: longer runs (deselect with -m 'not slow')",
    "mjx: needs JAX (CUDA), MuJoCo MJX and MuJoCo Playground (skipped automatically without them)",
]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
# Files that import Isaac Lab / ManiSkill / ns-3 bindings, which CI does not install.
extend-exclude = ["isaaclab_net/isaac/isaac_env_skeleton.py", "isaaclab_net/isaac/maniskill_adapter_skeleton.py",
                  "venv*", ".pydeps"]

[tool.ruff.lint]
# Light: syntax errors, undefined names, unused imports/variables, common pitfalls.
select = ["E4", "E7", "E9", "F"]
# The prototype uses compact one-liners (`a; b`, `x = lambda ...`) on purpose.
ignore = ["E701", "E702", "E731", "E741"]

[tool.ruff.lint.per-file-ignores]
# Existing prototype findings, left untouched (see tests/README.md).
"benchmarks/bench.py" = ["E402", "F821", "F841"]   # F821: false positive from `del net` after a closure
"benchmarks/bench_env.py" = ["E402"]
"tests/scripts/test_equiv.py" = ["F401"]
"isaaclab_net/isaac/netmodule.py" = ["F401", "F841"]
# Merged components, kept as delivered (dead locals in nrconfig's PHY; lab validation scripts).
"isaaclab_net/core/phy.py" = ["F841"]
"benchmarks/ns3/*" = ["E402", "F841"]
"tests/bridges/*" = ["E402", "F841"]
