# OAI 5G in rfsim mode for the isaaclab_net OAI bridge (validation only).
# Generated run directories hold this file next to gnb.yaml, nrue.yaml, the CN5G files and .env
# (make_configs.py). Start: `docker compose up -d`; UEs 2-4 are enabled through COMPOSE_PROFILES in .env.
# Topology and addresses follow OAI's ci-scripts/yaml_files/5g_rfsimulator (CN5G "mini", no NRF).
# Sidecars (python:3.11-slim) share the network namespace of a UE or of the data network host and run
# agent.py: `agent-ueK` sends the bridge's UDP frames from the UE's PDU session (oaitun_ue1), `sink`
# receives them behind the UPF with kernel timestamps. All containers share the host clock.

x-ue: &ue
  image: oaisoftwarealliance/oai-nr-ue:${TAG:-2026.w39}
  cap_drop: [ALL]
  cap_add: [NET_ADMIN, NET_RAW]   # no SYS_NICE: default-priority threads (see gNB below)
  devices: [/dev/net/tun:/dev/net/tun]
  ulimits: {memlock: -1}   # OAI calls mlockall(); a 64 MB default memlock limit makes later allocations fail
  depends_on: [oai-gnb]
  volumes:
    - ./nrue.yaml:/opt/oai-nr-ue/etc/nr-ue.yaml
  healthcheck:
    test: /bin/bash -c "ip -4 addr show oaitun_ue1 | grep -q inet"
    interval: 2s
    timeout: 2s
    retries: 60

x-agent: &agent
  image: python:3.11-slim
  volumes:
    - ./agent:/agent:ro
  init: true

services:
  mysql:
    container_name: ilnet-oai-mysql
    image: mysql:9.6
    init: true
    volumes:
      - ./oai_db.sql:/docker-entrypoint-initdb.d/oai_db.sql
      - ./mysql-healthcheck.sh:/tmp/mysql-healthcheck.sh
    environment:
      - MYSQL_DATABASE=oai_db
      - MYSQL_USER=test
      - MYSQL_PASSWORD=test
      - MYSQL_ROOT_PASSWORD=linux
    healthcheck:
      test: /bin/bash -c "/tmp/mysql-healthcheck.sh"
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      public_net: {ipv4_address: 192.168.71.131}
  oai-amf:
    container_name: ilnet-oai-amf
    image: oaisoftwarealliance/oai-amf:${CN_TAG:-v2.2.1}
    volumes:
      - ./mini_nonrf_config.yaml:/openair-amf/etc/config.yaml
    depends_on:
      mysql: {condition: service_healthy}
    networks:
      public_net: {ipv4_address: 192.168.71.132}
  oai-smf:
    container_name: ilnet-oai-smf
    image: oaisoftwarealliance/oai-smf:${CN_TAG:-v2.2.1}
    volumes:
      - ./mini_nonrf_config.yaml:/openair-smf/etc/config.yaml
    depends_on: [oai-amf]
    networks:
      public_net: {ipv4_address: 192.168.71.133}
  oai-upf:
    container_name: ilnet-oai-upf
    image: oaisoftwarealliance/oai-upf:${CN_TAG:-v2.2.1}
    init: true
    volumes:
      - ./mini_nonrf_config.yaml:/openair-upf/etc/config.yaml
    depends_on: [oai-smf]
    cap_add: [NET_ADMIN, SYS_ADMIN]
    cap_drop: [ALL]
    privileged: true
    networks:
      # eth0 = public (N3), eth1 = traffic (N6), as mini_nonrf_config.yaml expects; the priorities fix the order
      # (interface_name would need Docker Engine 28.1)
      public_net: {ipv4_address: 192.168.71.134, priority: 200}
      traffic_net: {ipv4_address: 192.168.72.134, priority: 100}
  oai-ext-dn:
    container_name: ilnet-oai-ext-dn
    image: oaisoftwarealliance/trf-gen-cn5g:latest
    privileged: true
    init: true
    entrypoint: /bin/bash -c "ip route add 12.1.1.0/24 via 192.168.72.134 dev eth0; sleep infinity"
    depends_on: [oai-upf]
    networks:
      traffic_net: {ipv4_address: 192.168.72.135}
  sink:
    <<: *agent
    container_name: ilnet-oai-sink
    network_mode: service:oai-ext-dn
    depends_on: [oai-ext-dn]
    command: python /agent/agent.py sink --ctl 0.0.0.0:5301 --port 5201
  oai-gnb:
    container_name: ilnet-oai-gnb
    image: oaisoftwarealliance/oai-gnb:${TAG:-2026.w39}
    # No SYS_NICE: with it OAI creates SCHED_FIFO threads, which fail with EAGAIN in this WSL2 kernel's containers
    # and would compete with other jobs on a shared host. Without it every thread runs at default priority.
    cap_drop: [ALL]
    ulimits: {memlock: -1}   # see x-ue
    environment:
      USE_ADDITIONAL_OPTIONS: >-
        -E --rfsim --rfsimulator.[0].options chanmod --telnetsrv --telnetsrv.listenaddr 192.168.71.140
        --log_config.global_log_options level,nocolor,time ${GNB_EXTRA:-}
      ASAN_OPTIONS: detect_leaks=0
    depends_on: [oai-ext-dn]
    volumes:
      - ./gnb.yaml:/opt/oai-gnb/etc/gnb.yaml
    networks:
      public_net: {ipv4_address: 192.168.71.140}
  oai-nr-ue1:
    <<: *ue
    container_name: ilnet-oai-ue1
    environment:
      USE_ADDITIONAL_OPTIONS: >-
        -E --rfsim ${UE_RADIO} --uicc0.imsi 208990100001100 --rfsimulator.[0].serveraddr 192.168.71.140
        --rfsimulator.[0].options chanmod --telnetsrv --telnetsrv.listenaddr 192.168.71.150
        --log_config.global_log_options level,nocolor,time ${UE_EXTRA:-}
    networks:
      public_net: {ipv4_address: 192.168.71.150}
  agent-ue1:
    <<: *agent
    container_name: ilnet-oai-agent-ue1
    network_mode: service:oai-nr-ue1
    depends_on: [oai-nr-ue1]
    command: python /agent/agent.py ue --ctl 0.0.0.0:5300
  oai-nr-ue2:
    <<: *ue
    profiles: [ue2]
    container_name: ilnet-oai-ue2
    depends_on: [oai-nr-ue1]
    environment:
      USE_ADDITIONAL_OPTIONS: >-
        -E --rfsim ${UE_RADIO} --uicc0.imsi 208990100001101 --rfsimulator.[0].serveraddr 192.168.71.140
        --rfsimulator.[0].options chanmod --telnetsrv --telnetsrv.listenaddr 192.168.71.151
        --log_config.global_log_options level,nocolor,time ${UE_EXTRA:-}
    networks:
      public_net: {ipv4_address: 192.168.71.151}
  agent-ue2:
    <<: *agent
    profiles: [ue2]
    container_name: ilnet-oai-agent-ue2
    network_mode: service:oai-nr-ue2
    depends_on: [oai-nr-ue2]
    command: python /agent/agent.py ue --ctl 0.0.0.0:5300
  oai-nr-ue3:
    <<: *ue
    profiles: [ue3]
    container_name: ilnet-oai-ue3
    depends_on: [oai-nr-ue2]
    environment:
      USE_ADDITIONAL_OPTIONS: >-
        -E --rfsim ${UE_RADIO} --uicc0.imsi 208990100001102 --rfsimulator.[0].serveraddr 192.168.71.140
        --rfsimulator.[0].options chanmod --telnetsrv --telnetsrv.listenaddr 192.168.71.152
        --log_config.global_log_options level,nocolor,time ${UE_EXTRA:-}
    networks:
      public_net: {ipv4_address: 192.168.71.152}
  agent-ue3:
    <<: *agent
    profiles: [ue3]
    container_name: ilnet-oai-agent-ue3
    network_mode: service:oai-nr-ue3
    depends_on: [oai-nr-ue3]
    command: python /agent/agent.py ue --ctl 0.0.0.0:5300
  oai-nr-ue4:
    <<: *ue
    profiles: [ue4]
    container_name: ilnet-oai-ue4
    depends_on: [oai-nr-ue3]
    environment:
      USE_ADDITIONAL_OPTIONS: >-
        -E --rfsim ${UE_RADIO} --uicc0.imsi 208990100001103 --rfsimulator.[0].serveraddr 192.168.71.140
        --rfsimulator.[0].options chanmod --telnetsrv --telnetsrv.listenaddr 192.168.71.153
        --log_config.global_log_options level,nocolor,time ${UE_EXTRA:-}
    networks:
      public_net: {ipv4_address: 192.168.71.153}
  agent-ue4:
    <<: *agent
    profiles: [ue4]
    container_name: ilnet-oai-agent-ue4
    network_mode: service:oai-nr-ue4
    depends_on: [oai-nr-ue4]
    command: python /agent/agent.py ue --ctl 0.0.0.0:5300

networks:
  public_net:
    driver: bridge
    name: ilnet-oai-public
    ipam:
      config:
        - subnet: 192.168.71.128/26
    driver_opts:
      com.docker.network.bridge.name: "ilnet-oai-pub"
  traffic_net:
    driver: bridge
    name: ilnet-oai-traffic
    ipam:
      config:
        - subnet: 192.168.72.128/26
    driver_opts:
      com.docker.network.bridge.name: "ilnet-oai-trf"
