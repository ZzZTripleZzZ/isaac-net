name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff>=0.5"
      - run: ruff check .

  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: CPU tests (GPU tests are skipped)
        run: python -m pytest -m "not gpu" -v --durations=10

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Only the docs extra: the API reference is read from the sources by griffe, and the tutorial notebooks
      # are stored executed, so the build needs neither torch nor the package's own dependencies.
      - name: Install docs dependencies
        run: |
          python - <<'EOF'
          import tomllib
          deps = tomllib.load(open("pyproject.toml", "rb"))["project"]["optional-dependencies"]["docs"]
          open("docs-requirements.txt", "w").write("\n".join(deps) + "\n")
          EOF
          pip install -r docs-requirements.txt
      - name: Build the docs site (no deploy)
        run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"
