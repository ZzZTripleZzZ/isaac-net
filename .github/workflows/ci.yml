name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff>=0.5"
      - run: ruff check .

  cpu-tests:
    name: cpu-tests (py${{ matrix.python }}, torch ${{ matrix.torch || 'latest' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # newest torch, full CPU suite
          - python: "3.11"
            torch: ""
            markers: "not gpu"
          # the floor of pyproject.toml (torch>=2.7: torch._dynamo.config.recompile_limit) on the oldest Python
          - python: "3.10"
            torch: "2.7.0"
            markers: "not gpu and not slow"
          # newest Python classifier
          - python: "3.12"
            torch: ""
            markers: "not gpu and not slow"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU-only torch
        run: pip install "torch${{ matrix.torch && format('=={0}', matrix.torch) || '' }}" --index-url https://download.pytorch.org/whl/cpu
      - name: Install package with dev extras
        run: pip install -e ".[dev]"
      - name: CPU tests (GPU tests are skipped)
        run: python -m pytest -m "${{ matrix.markers }}" -v --durations=10

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Only the docs extra: the API reference is read from the sources by griffe, and the tutorial notebooks
      # are stored executed, so the build needs neither torch nor the package's own dependencies.
      - name: Install docs dependencies
        run: |
          python - <<'EOF'
          import tomllib
          deps = tomllib.load(open("pyproject.toml", "rb"))["project"]["optional-dependencies"]["docs"]
          open("docs-requirements.txt", "w").write("\n".join(deps) + "\n")
          EOF
          pip install -r docs-requirements.txt
      - name: Build the docs site (no deploy)
        run: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "1"

  docs-examples:
    # Executes the Colab quick start and every Python block of docs/cookbook.md on a CPU, so the onboarding pages
    # cannot drift from the API. The stored notebook outputs are not compared; the run only has to succeed.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU-only torch, the package and the notebook tools
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e . nbconvert ipykernel matplotlib pandas pyarrow
      - name: Execute the Colab quick start
        run: jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=600 --output-dir "$RUNNER_TEMP" docs/tutorials/00_quickstart_colab.ipynb
      - name: Run every cookbook recipe
        working-directory: ${{ runner.temp }}
        run: |
          python - "$GITHUB_WORKSPACE/docs/cookbook.md" <<'EOF'
          import pathlib, re, subprocess, sys
          blocks = re.findall(r"```python\n(.*?)```", pathlib.Path(sys.argv[1]).read_text(), re.S)
          assert len(blocks) == 10, f"expected 10 recipes, found {len(blocks)}"
          for i, code in enumerate(blocks, 1):
              print(f"--- recipe {i}", flush=True)
              subprocess.run([sys.executable, "-c", code], check=True)
          EOF
